<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PIALANDO TRADICIONES — TV</title><style>html,body{margin:0;width:100%;height:100%;background:#050816;color:white;font-family:Arial,sans-serif;overflow:hidden}.tv-screen{width:100%;height:100%;background:#050816 center/cover no-repeat;display:grid;place-items:center}.overlay{width:88%;display:grid;grid-template-columns:260px 1fr;gap:40px;align-items:center;padding:34px;border-radius:30px;background:rgba(6,5,22,.42);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(7px)}.logo{width:260px;height:260px;object-fit:contain}.label{font-size:18px;letter-spacing:.18em;color:#ffd5ff}.title{font-size:clamp(42px,6vw,92px);font-weight:900;margin-top:8px}.sub{font-size:clamp(22px,2.5vw,38px);color:#e4d8ef;margin-top:15px}.status{margin-top:28px;font-size:18px;font-weight:900;letter-spacing:.14em;color:#ff4bc8}.eq{display:flex;align-items:flex-end;gap:5px;height:60px;margin-top:25px}.eq i{width:8px;height:15px;background:linear-gradient(#ff37c9,#8d43ff);border-radius:5px;animation:eq .8s infinite alternate}.eq i:nth-child(2n){animation-delay:.15s}.eq i:nth-child(3n){animation-delay:.3s}@keyframes eq{to{height:55px}}@media(max-width:800px){.overlay{grid-template-columns:1fr;text-align:center}.logo{width:180px;height:180px;margin:auto}}</style></head><body><main class="tv-screen" id="tv"><section class="overlay"><img id="logo" class="logo" src="/assets/logo-pialando.png"><div><div id="label" class="label">ESTÁS ESCUCHANDO</div><div id="title" class="title">PIALANDO TRADICIONES</div><div id="sub" class="sub">Con toda la mejor música y nuestras tradiciones</div><div id="status" class="status">EN VIVO</div><div class="eq" id="eq"></div></div></section><audio id="audio"></audio></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
const $=id=>document.getElementById(id);let cfg={};let audio=$('audio');let supa=null;for(let i=0;i<24;i++)$('eq').appendChild(document.createElement('i'));
async function load(){const r=await fetch('/.netlify/functions/public-config?t='+Date.now(),{cache:'no-store'});cfg=await r.json();$('tv').style.backgroundImage=`url("${cfg.tvBgUrl||cfg.horizontalBgUrl||'/assets/fondo-horizontal.png'}")`;$('logo').src=cfg.logoUrl||'/assets/logo-pialando.png';$('label').textContent=cfg.topLabel||'ESTÁS ESCUCHANDO';$('title').textContent=cfg.title||cfg.radioName||'PIALANDO TRADICIONES';$('sub').textContent=cfg.playingText||'';if(cfg.streamUrl&&audio.src!==cfg.streamUrl){audio.src=cfg.streamUrl;audio.load()}audio.play().catch(()=>{}); if(window.supabase&&cfg.supabaseUrl&&cfg.supabaseAnonKey){supa=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey);supa.channel('tv-config').on('postgres_changes',{event:'*',schema:'public',table:'radio_config'},p=>{if(p.new?.config){cfg={...cfg,...p.new.config};apply()}}).subscribe()}}
function apply(){ $('tv').style.backgroundImage=`url("${cfg.tvBgUrl||cfg.horizontalBgUrl||'/assets/fondo-horizontal.png'}")`;$('logo').src=cfg.logoUrl||'/assets/logo-pialando.png';$('label').textContent=cfg.topLabel||'ESTÁS ESCUCHANDO';$('title').textContent=cfg.title||cfg.radioName;$('sub').textContent=cfg.playingText||'';if(cfg.streamUrl&&audio.src!==cfg.streamUrl){const playing=!audio.paused;audio.src=cfg.streamUrl;audio.load();if(playing)audio.play().catch(()=>{})}}
audio.addEventListener('playing',()=>$('status').textContent='EN VIVO');audio.addEventListener('waiting',()=>$('status').textContent='CONECTANDO…');audio.addEventListener('error',()=>{if(cfg.backupStreamUrl&&audio.src!==cfg.backupStreamUrl){audio.src=cfg.backupStreamUrl;audio.load();audio.play().catch(()=>{})}else $('status').textContent='SEÑAL NO DISPONIBLE'});load();
</script></body></html>
